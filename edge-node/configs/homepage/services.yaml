- Cerberus Threat Intel:
    - Suricata IDS:
        widget:
          type: customapi
          url: http://host.containers.internal:8484/suricata.json
          refreshInterval: 60000
          mappings:
            - field: high_critical_alerts
              label: Alerts (24h)
              format: number
            - field: persistent_sources
              label: Persistent Sources
              format: text
    - Cowrie Honeypot:
        widget:
          type: customapi
          url: http://host.containers.internal:8484/cowrie.json
          refreshInterval: 60000
          mappings:
            - field: connections
              label: Sessions (24h)
              format: number
            - field: unique_ips
              label: Unique IPs
              format: number
            - field: top_ip
              label: Top IP
              format: text
    - NightForge Shield:
        widget:
          type: customapi
          url: http://host.containers.internal:8484/nftables.json
          refreshInterval: 60000
          mappings:
            - field: blackhole_drops
              label: Blackhole Drops
              format: number
            - field: input_drops
              label: Input Drops
              format: number

- Node Metrics:
    - Cerberus CPU:
        widget:
          type: customapi
          url: http://host.containers.internal:8485/api/4/cpu
          refreshInterval: 10000
          mappings:
            - field: total
              label: CPU %
              format: float
            - field: iowait
              label: IOWait %
              format: float
    - Cerberus Memory:
        widget:
          type: customapi
          url: http://host.containers.internal:8485/api/4/mem
          refreshInterval: 10000
          mappings:
            - field: percent
              label: Used %
              format: float
            - field: available
              label: Available (bytes)
              format: number
    - Tairn:
        widget:
          type: customapi
          url: http://host.containers.internal:8487/api/4/cpu
          refreshInterval: 10000
          mappings:
            - field: total
              label: CPU %
              format: float
            - field: user
              label: User %
              format: float
    - Hermes:
        widget:
          type: customapi
          url: http://host.containers.internal:8488/api/4/cpu
          refreshInterval: 10000
          mappings:
            - field: total
              label: CPU %
              format: float
            - field: user
              label: User %
              format: float

- Network:
    - WireGuard Peers:
        widget:
          type: customapi
          url: http://host.containers.internal:8484/wg.json
          refreshInterval: 30000
          mappings:
            - field: peers.0.name
              label: Peer 1
              format: text
            - field: peers.0.handshake_seconds
              label: Handshake (s)
              format: number
            - field: peers.1.name
              label: Peer 2
              format: text
            - field: peers.1.handshake_seconds
              label: Handshake (s)
              format: number
            - field: peers.2.name
              label: Peer 3
              format: text
            - field: peers.2.handshake_seconds
              label: Handshake (s)
              format: number

- Core Infrastructure:
    - Vaultwarden:
        icon: /icons/vaultwarden.png
        href: https://vault.lan
        description: Password Management
    - Gitea:
        icon: /icons/gitea.png
        href: https://git.lan
        description: Private Git Server
        widget:
          type: gitea
          url: http://host.containers.internal:8486
          key: "{{HOMEPAGE_VAR_GITEA_TOKEN}}"
          version: 1
    - Pi-hole:
        icon: /icons/pi-hole.png
        href: https://pihole.lan/admin
        description: Network DNS & Ad Block
    - SearXNG:
        icon: /icons/searxng.png
        href: https://search.lan
        description: Private Search
